[workspace]
members = ["common","sim"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/umwelt-sim/mildew-valley"
publish = false

[workspace.dependencies]
umwelt = { path = "../umwelt-rs" }
async-nats = "0.50"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
