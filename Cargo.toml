[workspace]
members = ["common", "edge", "gameclient", "sim"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/umwelt-sim/mildew-valley"
publish = false

[workspace.dependencies]
umwelt = { path = "../umwelt-rs" }
mildew-common = { path = "common" }
async-nats = "0.50"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
